<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Player Log</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" type="image/png" href="logo.png" />
    <style>
      table { width: 100%; max-width: 920px; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #333; padding: 8px 10px; text-align: left; }
      th { opacity: 0.9; }
      .actions { 
        margin: 1rem 0; 
        display: flex; 
        gap: 12px; 
        justify-content: center; 
        align-items: stretch; 
        flex-wrap: wrap;
        width: 100%;
        max-width: 920px;
      }
      .actions .btn {
        flex: 1 1 220px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="Logo" class="page-logo" />
    <div class="container">
      <div class="flex-center flex-column">
        <h1>Player Log</h1>
        <div class="actions">
          <button class="btn" id="exportBtn">Export CSV</button>
          <button class="btn" id="clearPlaysBtn">Clear Player Log</button>
          <a class="btn" href="index.html">Go Home</a>
        </div>
        <table id="playsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Score</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="playsBody"></tbody>
        </table>
      </div>
    </div>
    <script src="plays.js"></script>
  </body>
</html>
