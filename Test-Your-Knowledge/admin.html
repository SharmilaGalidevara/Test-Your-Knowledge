<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Test Your Knowledge</title>
    <link rel="stylesheet" href="app.css">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .admin-actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .btn {
            padding: 1rem 2rem;
            font-size: 1.6rem;
        }
        .data-section {
            background: white;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 0.2rem 0.5rem rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .data-section h3 {
            margin-bottom: 1rem;
            color: #56a5eb;
        }
        #scoresList, #playsList {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 1rem;
            border-radius: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Admin Panel</h1>
            <button id="logoutBtn" class="btn">Logout</button>
        </div>
        
        <div class="admin-actions">
            <button id="exportBtn" class="btn">Export to CSV</button>
            <button id="clearScoresBtn" class="btn btn-warning">Clear High Scores</button>
            <button id="clearLogsBtn" class="btn btn-danger">Clear Player Logs</button>
        </div>
        
        <div class="data-section">
            <h3>High Scores</h3>
            <div id="scoresList">Loading high scores...</div>
        </div>
        
        <div class="data-section">
            <h3>Player Logs</h3>
            <div id="playsList">Loading player logs...</div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
